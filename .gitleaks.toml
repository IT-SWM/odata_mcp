# Gitleaks configuration file
# This prevents committing secrets and credentials

title = "gitleaks config"

# Additional patterns to detect
[[rules]]
description = "MCP configuration files"
path = '''(.*zmcp.*\.json|zmcp\.json)'''
tags = ["config", "credentials"]

[[rules]]
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret|api[_-]?token)['"]?\s*[:=]\s*['"]?([a-zA-Z0-9_\-]{20,})'''
tags = ["key", "API", "generic"]

[[rules]]
description = "Generic Secret"
regex = '''(?i)(secret|password|passwd|pwd|token|tkn)['"]?\s*[:=]\s*['"]?([a-zA-Z0-9_\-!@#$%^&*]{8,})'''
tags = ["secret", "generic"]

[[rules]]
description = "Base64 encoded secrets"
regex = '''(?i)(secret|password|token|key)['"]?\s*[:=]\s*['"]?(eyJ[a-zA-Z0-9_\-]+\.[a-zA-Z0-9_\-]+\.[a-zA-Z0-9_\-]+)'''
tags = ["jwt", "secret"]

# Allowlist
[allowlist]
description = "Known false positives"
# Match the regexes below against the whole finding, not only its first group
regexTarget = "match"
paths = [
    '''go\.sum$''',
    '''go\.mod$''',
    '''.*_test\.go$''',
    '''test/.*''',
    # Docs only carry placeholder credentials
    '''.*\.md$''',
]
# This commit put a placeholder password into a comment of this file
commits = ["f54eeffa0ad672b963bfa1b336f226a6a8b0c589"]
regexes = [
    '''(test|example|sample|demo|dummy)''',
    # Go identifiers, not secrets: OData paging option, header name, variable copy
    '''\$skiptoken''',
    '''X-OData-Password''',
    '''(?i)password\s*=\s*password\b''',
]
