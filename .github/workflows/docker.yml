# Baut für jeden Branch und jeden v*-Tag ein Container-Image und legt es
# unter ghcr.io/it-swm/odata-mcp ab.
#
# Tags:
#   <branch>      z. B. feature-per-user-auth-headers ("/" wird zu "-")
#   sha-<kurz>    unveränderlich, für stabile Deployments (z. B. in Obot)
#   <version>     bei Git-Tags v1.2.3 -> 1.2.3
#   latest        nur vom Default-Branch (main)
name: Docker image

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/it-swm/odata-mcp
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
